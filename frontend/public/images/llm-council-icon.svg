<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="LLM Council">
  <defs>
    <linearGradient id="lc-bg" x1="4" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5da3ea"/>
      <stop offset="100%" stop-color="#4a90e2"/>
    </linearGradient>
    <linearGradient id="lc-gold" x1="12" y1="19" x2="20" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f7b84a"/>
      <stop offset="100%" stop-color="#e8941a"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="8" fill="url(#lc-bg)"/>

  <!-- Council voices -->
  <circle cx="8.5" cy="10" r="2.75" fill="#f0f7ff"/>
  <circle cx="16" cy="7.5" r="2.75" fill="#f0f7ff"/>
  <circle cx="23.5" cy="10" r="2.75" fill="#f0f7ff"/>

  <!-- Convergence -->
  <g stroke="#ffffff" stroke-width="1.25" stroke-linecap="round" opacity="0.55" fill="none">
    <path d="M8.5 12.75 L16 20"/>
    <path d="M16 10.25 L16 20"/>
    <path d="M23.5 12.75 L16 20"/>
  </g>

  <!-- Chairman synthesis -->
  <circle cx="16" cy="23" r="4.25" fill="url(#lc-gold)"/>
  <circle cx="16" cy="23" r="1.75" fill="#fff8eb"/>
</svg>
