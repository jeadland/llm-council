<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="nodeBlue" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="50%" stop-color="#4a90e2"/>
      <stop offset="100%" stop-color="#1e4f8c"/>
    </radialGradient>
    <radialGradient id="nodeGold" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
    <filter id="gB" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gG" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#0a1628"/>
  <circle cx="50" cy="50" r="48" fill="none" stroke="#1e3f6e" stroke-width="1.5"/>
  
  <!-- Outer glow ring -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#4a90e2" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Connections: center to nodes -->
  <!-- Top: 50,14 | TR: 79,31 | BR: 79,69 | Bot: 50,86 | BL: 21,69 | TL: 21,31 -->
  <g stroke="#4a90e2" stroke-width="1" opacity="0.5">
    <line x1="50" y1="50" x2="50" y2="14"/>
    <line x1="50" y1="50" x2="79" y2="31"/>
    <line x1="50" y1="50" x2="79" y2="69"/>
    <line x1="50" y1="50" x2="50" y2="86"/>
    <line x1="50" y1="50" x2="21" y2="69"/>
    <line x1="50" y1="50" x2="21" y2="31"/>
  </g>
  
  <!-- Hexagon -->
  <polygon points="50,14 79,31 79,69 50,86 21,69 21,31"
    fill="none" stroke="#4a90e2" stroke-width="0.8" opacity="0.4" stroke-dasharray="2,3"/>
  
  <!-- Cross connections -->
  <g stroke="#4a90e2" stroke-width="0.4" opacity="0.15">
    <line x1="50" y1="14" x2="79" y2="69"/>
    <line x1="79" y1="31" x2="50" y2="86"/>
    <line x1="50" y1="14" x2="21" y2="69"/>
    <line x1="21" y1="31" x2="50" y2="86"/>
    <line x1="79" y1="31" x2="21" y2="69"/>
    <line x1="21" y1="31" x2="79" y2="69"/>
  </g>
  
  <!-- Node halos -->
  <g fill="#4a90e2" opacity="0.14">
    <circle cx="50" cy="14" r="9"/>
    <circle cx="79" cy="31" r="9"/>
    <circle cx="79" cy="69" r="9"/>
    <circle cx="50" cy="86" r="9"/>
    <circle cx="21" cy="69" r="9"/>
    <circle cx="21" cy="31" r="9"/>
  </g>
  
  <!-- Outer nodes -->
  <g filter="url(#gB)">
    <circle cx="50" cy="14" r="6" fill="url(#nodeBlue)"/>
    <circle cx="79" cy="31" r="6" fill="url(#nodeBlue)"/>
    <circle cx="79" cy="69" r="6" fill="url(#nodeBlue)"/>
    <circle cx="50" cy="86" r="6" fill="url(#nodeBlue)"/>
    <circle cx="21" cy="69" r="6" fill="url(#nodeBlue)"/>
    <circle cx="21" cy="31" r="6" fill="url(#nodeBlue)"/>
  </g>
  
  <!-- Chairman glow -->
  <circle cx="50" cy="50" r="14" fill="#f5a623" opacity="0.12"/>
  
  <!-- Chairman node -->
  <circle cx="50" cy="50" r="10" fill="url(#nodeGold)" filter="url(#gG)"/>
  <circle cx="50" cy="50" r="6" fill="none" stroke="#fff8dc" stroke-width="0.8" opacity="0.5"/>
  <circle cx="50" cy="50" r="3" fill="#fffbeb" opacity="0.95"/>
</svg>
